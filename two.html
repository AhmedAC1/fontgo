<!DOCTYPE HTML>
<html>  
    <head>  
        <title>Fontgo: Website for fonts</title>  
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">  
        <link rel="stylesheet" href="https://ahmedac1.github.io/fontgo/v1/fonts/css/Black+Ops+One.css">  
        <style>  
            body {  
                font-family: "Black Ops One", sans-serif;  
                background-color: rgb(255, 100, 128);  
                color: #fff;  
                padding: 25px;  
                font-weight: bold;  
            }  
            .desc {  
                font-family: sans-serif;  
                font-weight: normal;  
            }  
            button {  
                background-color: rgb(128, 50, 64);  
                border: 4px solid rgb(64, 25, 32);  
                border-radius: 4px;  
                color: #fff;  
                font-size: 20px;  
                padding-right: 10px;  
                padding-left: 10px;  
                font-family: "Black Ops One", sans-serif;  
                font-weight: normal;  
            }  
            a {  
                color: #fff;  
                text-decoration: none;  
            }  
            .warning {  
                color: #ffff00;  
                font-weight: bold;  
            }  
        </style>  
    </head>  
    <body>  
        <script src="https://ahmedac1.github.io/fontgo/jstools/jstools.js"></script>  
        <h1>Fontgo: All of the fonts</h1>  
        <div class="warning"><span class="material-symbols-outlined">warning</span>Warning: This uses an API. It can sometimes error out.</div>  
        <hr>  
        <div class="desc" id="l">[Loading...]</div>  
        <script type="module">  
            const div = document.getElementById("l");  const all = await getAllFonts();  
            div.textContent = all.join(", ").replaceAll(".ttf", "").replaceAll("+", " ");  
    </script>  
    <hr>  
    <button><a href="index.html">Return to homepage</a></button>  
</body>

</html>
